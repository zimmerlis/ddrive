<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Minimal Squircle Background -->
  <rect width="256" height="256" rx="56" fill="#0f172a"/>

  <!-- WebDAV Cloud + Drive Hybrid Monogram ('d') -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    
    <!-- Hard Drive Base / Tray -->
    <rect x="44" y="148" width="168" height="52" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="8"/>
    
    <!-- Drive Slot Line & Status Node -->
    <line x1="68" y1="174" x2="162" y2="174" stroke="#64748b" stroke-width="6"/>
    <circle cx="188" cy="174" r="5" fill="#38bdf8" stroke="none"/>

    <!-- Cloud Outline (WebDAV) -->
    <path d="M 72 134 
             A 28 28 0 0 1 84 82 
             A 38 38 0 0 1 154 68 
             A 32 32 0 0 1 184 104 
             A 26 26 0 0 1 184 134" 
          stroke="#38bdf8" 
          stroke-width="8"/>

    <!-- Integrated Geometric 'd' Monogram & Uplink -->
    <!-- 'd' stem connecting cloud down to drive -->
    <line x1="142" y1="74" x2="142" y2="134" stroke="#ffffff" stroke-width="8"/>
    <!-- 'd' bowl -->
    <circle cx="120" cy="112" r="22" stroke="#ffffff" stroke-width="8"/>
  </g>
</svg>
